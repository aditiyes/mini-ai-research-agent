<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7f3">
    <title>Mini Research Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="Mini Research Agent home">
        <span class="brand-mark">MR</span>
        <span>Mini Research Agent</span>
      </a>
      <div class="index-status"><span class="status-dot"></span>WIKIPEDIA LIVE INDEX</div>
    </header>

    <main class="page-shell">
      <section class="intro" aria-labelledby="page-title">
        <div class="eyebrow"><span>RESEARCH DESK</span><span class="eyebrow-divider">/</span><span>01</span></div>
        <h1 id="page-title">Research brief</h1>
      </section>

      <form id="research-form" class="question-form">
        <label for="question">Your question</label>
        <textarea id="question" name="question" maxlength="500" rows="3" required placeholder="What is changing in urban heat research?" autocomplete="off"></textarea>
        <div id="access-field" class="access-field" hidden>
          <label for="access-code">App access code</label>
          <input id="access-code" type="password" autocomplete="current-password" placeholder="Enter access code">
        </div>
        <div class="form-footer">
          <span id="question-count" class="character-count">0 / 500</span>
          <button id="submit-button" type="submit">Build brief <span aria-hidden="true">&rarr;</span></button>
        </div>
      </form>

      <div id="run-status" class="run-status" role="status" aria-live="polite"></div>

      <section id="report" class="report" aria-label="Research report" hidden>
        <div class="report-meta">
          <span>RESEARCH OUTPUT</span>
          <span id="report-date"></span>
        </div>

        <section class="report-section" aria-labelledby="evidence-title">
          <div class="section-heading">
            <span class="section-number">01</span>
            <h2 id="evidence-title">Evidence</h2>
          </div>
          <div id="evidence-list" class="evidence-list"></div>
        </section>

        <section class="report-section synthesis-section" aria-labelledby="synthesis-title">
          <div class="section-heading">
            <span class="section-number">02</span>
            <h2 id="synthesis-title">Synthesis</h2>
          </div>
          <p id="synthesis-text" class="synthesis-text"></p>
        </section>

        <section class="report-section" aria-labelledby="sources-title">
          <div class="section-heading">
            <span class="section-number">03</span>
            <h2 id="sources-title">Source notes</h2>
          </div>
          <ol id="source-notes" class="source-notes"></ol>
        </section>

        <details class="trace-details">
          <summary>Run trace</summary>
          <pre id="trace-output"></pre>
        </details>
      </section>
    </main>

    <footer class="page-footer">
      <span>MINI RESEARCH AGENT</span>
      <span>OPENAI KEY STORED SERVER-SIDE</span>
    </footer>
  </body>
</html>
