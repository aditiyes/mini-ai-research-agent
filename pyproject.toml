[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-ai-research-agent"
version = "0.1.0"
description = "A read-only research agent with a CLI and hosted web interface."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
	"openai>=1.30",
	"httpx>=0.27",
	"fastapi>=0.115,<1",
	"uvicorn[standard]>=0.30,<1",
	"python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mini-research = "mini_research_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mini_research_agent = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
